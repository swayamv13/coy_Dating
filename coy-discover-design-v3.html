/* v3 profile editor + launcher */
.nav{width:min(100%,590px)}
.home-launch{max-width:820px;margin:20px auto 35px;display:grid;grid-template-columns:1.1fr .9fr;gap:16px}

.preview-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:13px}

<script>
const profiles=[
['Aarav',24,'Bengaluru','Weekend hikes, tiny cafés and playlists for every mood.',['Travel','Music','Coffee'],12,'Product designer','Looking for good conversations and new places.'],

['Sara',25,'Chennai','Ocean person, playlist curator and amateur runner.',['Running','Beach','Music'],32,'Architect','Sunrise walks are my favourite.'],

['Diya',22,'Kolkata','Museum afternoons and conversations that go past midnight.',['Art','Culture','Books'],45,'Student','Old buildings and new ideas.'],

['Aditi',27,'Chennai','Slow mornings, strong coffee and spontaneous plans.',['Coffee','Travel','Culture'],39,'Researcher','Finding joy in small things.'],

].map((p,i)=>({id:i+1,name:p[0],age:p[1],city:p[2],bio:p[3],interests:p[4],img:`https://i.pravatar.cc/700?img=${p[5]}`,job:p[6],about:p[7]}));
const hiddenIncoming=new Set([3,7,12,18,24,29]); // demo-only incoming likes; never rendered in feed or UI
const KEY='coy-discover-v2';
let state=readState(),filters={city:'Any',ageMin:18,ageMax:35,interest:'Any'};
function readState(){try{return JSON.parse(localStorage.getItem(KEY))||{swipes:{},matches:[],blocked:[],reported:[]}}catch{return{swipes:{},matches:[],blocked:[],reported:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateCounts()}
function updateCounts(){document.getElementById('navCount').innerHTML=state.matches.length?`<span class="count">${state.matches.length}</span>`:''}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
function remaining(){return profiles.filter(p=>!state.swipes[p.id]&&!state.blocked.includes(p.id)).filter(p=>p.age>=filters.ageMin&&p.age<=filters.ageMax&&(filters.city==='Any'||p.city===filters.city)&&(filters.interest==='Any'||p.interests.includes(filters.interest)))}
function tab(t){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='discover')renderDiscover();if(t==='matches')renderMatches();if(t==='home')renderHome()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function renderHome(){document.getElementById('view').innerHTML=`<section class="home-card"><div class="emoji">💌</div><div class="eyebrow">Your Coy space</div><h2>Home is a little quiet for now</h2><p>This is the Home placeholder. Discover is the new experience in this assignment. Your likes stay private until there is a mutual connection.</p><button class="primary" onclick="tab('discover')">Explore Discover</button></section>`}
function renderDiscover(){
let list=remaining(),p=list[0],done=Object.keys(state.swipes).length+state.blocked.length,percent=Math.min(100,done/30*100);
if(!p){document.getElementById('view').innerHTML=`<div class="hero"><div class="eyebrow">Discover</div><h1>You're all caught up.</h1><p>You've seen everyone available with your current filters.</p></div><div class="empty"><div class="emoji">✨</div><h2>No more profiles right now</h2><p>Try adjusting your filters, or replay the demo to explore all 30 fictional profiles again.</p><button class="primary" onclick="openFilters()">Adjust filters</button> <button class="secondary" onclick="resetDemo()">Replay demo</button></div>`;return}
document.getElementById('view').innerHTML=`<div class="hero"><div class="eyebrow">A little closer to a connection</div><h1>Discover your people.</h1><p>Swipe in secret. Match when it's mutual.</p></div>
<div class="discover-grid"><section class="deck-area"><div class="card-stage" id="stage"><article class="profile-card" id="profileCard"><div class="stamp like" id="likeStamp">LIKE</div><div class="stamp pass" id="passStamp">PASS</div><div class="photo"><img src="${p.img}" alt="Fictional profile photo" onerror="this.style.opacity=0"><span class="photo-label">✦ YOUR NEXT HELLO?</span><span class="photo-count">${done+1} / 30</span><button class="more-btn" id="moreBtn" aria-label="Profile options">•••</button></div><div class="profile-info"><div class="name-line"><span class="name">${p.name}</span><span class="age">${p.age}</span><span class="verified">✓ DEMO</span></div><div class="location">⌖ ${p.city} · ${p.job}</div><p class="bio">${p.bio}</p><div class="chips">${p.interests.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div></article></div><div class="controls"><button class="action pass" id="passBtn" aria-label="Pass">✕</button><button class="action like" id="likeBtn" aria-label="Like">♥</button></div><div class="hint">Drag the card left or right, or tap a button</div></section>
<aside class="side"><section class="panel privacy"><div class="panel-icon">🔒</div><h3>Your likes stay private</h3><p>People never know you liked them unless they like you back. Only mutual likes become matches.</p></section>
<section class="panel"><div class="progress-top"><strong>Discovery progress</strong><span>${done} / 30 explored</span></div><div class="progress"><i style="width:${percent}%"></i></div><div class="how-row"><span class="how-ico">♥</span> Swipe right to like</div><div class="how-row"><span class="how-ico" style="background:var(--peach)">✕</span> Swipe left to pass</div><div class="how-row"><span class="how-ico" style="background:#fff0c7">✦</span> Match when it's mutual</div></section>
<section class="panel"><h3>Make discovery yours</h3><p>Choose an age range, city and interests to refine the profiles you see.</p><button class="filter-btn" id="filterBtn" style="margin-top:11px">☷ <span>Adjust filters</span></button></section></aside></div>`;
document.getElementById('likeBtn').onclick=()=>swipe('like',p);document.getElementById('passBtn').onclick=()=>swipe('pass',p);document.getElementById('filterBtn').onclick=openFilters;document.getElementById('moreBtn').onclick=()=>openSafety(p);attachDrag(p)
}
function swipe(action,p){if(state.swipes[p.id])return;state.swipes[p.id]=action;let matched=action==='like'&&hiddenIncoming.has(p.id);if(matched&&!state.matches.includes(p.id))state.matches.push(p.id);save();let card=document.getElementById('profileCard');if(card){card.style.transform=action==='like'?'translate(130%,15px) rotate(20deg)':'translate(-130%,15px) rotate(-20deg)';card.style.opacity=0}setTimeout(()=>{if(matched)showMatch(p);else{toast(action==='like'?'Like saved privately':'Passed · profile hidden');renderDiscover()}},220)}
function attachDrag(p){let card=document.getElementById('profileCard'),sx=0,sy=0,dx=0,drag=false;card.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;dx=0;drag=true;card.setPointerCapture(e.pointerId);card.style.transition='none'});card.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;let dy=e.clientY-sy;card.style.transform=`translate(${dx}px,${dy*.22}px) rotate(${dx*.05}deg)`;document.getElementById('likeStamp').style.opacity=Math.max(0,Math.min(1,dx/85));document.getElementById('passStamp').style.opacity=Math.max(0,Math.min(1,-dx/85))});function end(){if(!drag)return;drag=false;card.style.transition='transform .23s ease,opacity .23s ease';if(dx>90)swipe('like',p);else if(dx< -90)swipe('pass',p);else card.style.transform='';document.getElementById('likeStamp').style.opacity=0;document.getElementById('passStamp').style.opacity=0}card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end)}
function showMatch(p){openModal(`<div class="match-modal"><button class="close" onclick="closeModal()">×</button><div class="spark">✦ ♥ ✦</div><div class="eyebrow">A little spark just happened</div><h2>It's a match!</h2><p>You both liked each other. The feeling is mutual.</p><div class="avatars"><img src="https://i.pravatar.cc/200?img=12"><img src="${p.img}"></div><strong>You + ${p.name}</strong><p>${p.name} is now in your mutual matches.</p><div class="modal-actions"><button class="primary" onclick="closeModal();tab('matches')">See your matches</button><button class="secondary" onclick="closeModal();renderDiscover()">Keep discovering</button></div></div>`)}
function renderMatches(){let list=state.matches.map(id=>profiles.find(p=>p.id===id)).filter(Boolean);document.getElementById('view').innerHTML=`<div class="section-head"><div><div class="eyebrow">Mutual connections</div><h2>Your matches ♡</h2><p>Only people you've both liked appear here.</p></div><span class="count-pill">${list.length} MATCH${list.length===1?'':'ES'}</span></div>${list.length?`<div class="matches-grid">${list.map(p=>`<article class="match-card"><img src="${p.img}" alt="Fictional profile photo"><div class="match-info"><strong>${p.name}, ${p.age}</strong><p>⌖ ${p.city} · ${p.interests.slice(0,2).join(' · ')}</p><button onclick="toast('Demo only · messaging is not part of this prototype')">Say hello ↗</button></div></article>`).join('')}</div>`:`<div class="empty"><div class="emoji">♡</div><h2>No matches yet</h2><p>Like someone you're into. They won't know unless they like you back. If it's mutual, you'll see them here.</p><button class="primary" onclick="tab('discover')">Discover people</button></div>`}`}
function openModal(content){document.getElementById('modal').innerHTML=content;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function openFilters(){let cities=['Any',...new Set(profiles.map(p=>p.city))],interests=['Any',...new Set(profiles.flatMap(p=>p.interests))];openModal(`<button class="close" onclick="closeModal()">×</button><div class="eyebrow">Personalise your feed</div><h2>Discovery filters</h2><p>Filters only change which profiles appear in your demo feed.</p><div class="field"><label>City</label><select id="cityFilter">${cities.map(c=>`<option ${filters.city===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Age range</label><div class="range-row"><span>Minimum: <b id="minLabel">${filters.ageMin}</b></span><span>Maximum: <b id="maxLabel">${filters.ageMax}</b></span></div><input id="minAge" type="range" min="18" max="35" value="${filters.ageMin}"><input id="maxAge" type="range" min="18" max="35" value="${filters.ageMax}"></div><div class="field"><label>Interest</label><select id="interestFilter">${interests.map(c=>`<option ${filters.interest===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="modal-actions"><button class="secondary" onclick="clearFilters()">Clear</button><button class="primary" onclick="applyFilters()">Apply filters</button></div>`);document.getElementById('minAge').oninput=e=>document.getElementById('minLabel').textContent=e.target.value;document.getElementById('maxAge').oninput=e=>document.getElementById('maxLabel').textContent=e.target.value}
function applyFilters(){let a=+document.getElementById('minAge').value,b=+document.getElementById('maxAge').value;filters={city:document.getElementById('cityFilter').value,ageMin:Math.min(a,b),ageMax:Math.max(a,b),interest:document.getElementById('interestFilter').value};closeModal();tab('discover');toast('Filters applied')}
function clearFilters(){filters={city:'Any',ageMin:18,ageMax:35,interest:'Any'};closeModal();tab('discover');toast('Filters cleared')}
function openSafety(p){openModal(`<button class="close" onclick="closeModal()">×</button><div class="eyebrow">Your comfort matters</div><h2>Profile options</h2><p>Choose what you'd like to do with ${p.name}'s demo profile.</p><button class="safety-option" onclick="showDetails(${p.id})">ⓘ &nbsp; View full profile details</button><button class="safety-option" onclick="reportProfile(${p.id})">⚑ &nbsp; Report this profile</button><button class="safety-option" onclick="blockProfile(${p.id})">⊘ &nbsp; Block this profile</button><div class="detail-section"><p>Reporting and blocking are simulated locally in this prototype. No report is sent to Coy.</p></div>`)}
function showDetails(id){let p=profiles.find(x=>x.id===id);openModal(`<button class="close" onclick="openSafety(profiles.find(x=>x.id===${id}))">‹</button><div class="eyebrow">Profile details</div><h2>${p.name}, ${p.age}</h2><img class="detail-photo" src="${p.img}"><div class="detail-section"><strong>LOCATION & WORK</strong><p>⌖ ${p.city} · ${p.job}</p></div><div class="detail-section"><strong>ABOUT ${p.name.toUpperCase()}</strong><p>${p.bio} ${p.about}</p></div><div class="detail-section"><strong>INTERESTS</strong><div class="chips" style="margin-top:8px">${p.interests.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div><div class="modal-actions"><button class="secondary" onclick="openSafety(profiles.find(x=>x.id===${id}))">Profile options</button><button class="primary" onclick="closeModal();swipe('like',profiles.find(x=>x.id===${id}))">Like profile</button></div>`)}
function reportProfile(id){if(!confirm('Report this demo profile? This action is simulated and will hide the profile.'))return;state.reported.push(id);state.blocked.push(id);save();closeModal();renderDiscover();toast('Demo report recorded · profile hidden')}
function blockProfile(id){if(!confirm('Block this profile? It will be removed from your feed and matches in this demo.'))return;state.blocked.push(id);state.matches=state.matches.filter(x=>x!==id);save();closeModal();renderDiscover();toast('Profile blocked in this demo')}
function resetDemo(){if(!confirm('Reset demo swipes, matches, blocks and reports?'))return;state={swipes:{},matches:[],blocked:[],reported:[]};save();filters={city:'Any',ageMin:18,ageMax:35,interest:'Any'};closeModal();tab('discover');toast('Demo reset')}
document.getElementById('resetBtn').onclick=resetDemo;updateCounts();renderDiscover();

// v3: profile management, live preview and Coy home launcher.
const PROFILE_KEY='coy-discover-profile-v3';
const defaultMyProfile={name:'Swayam',age:24,city:'Bengaluru',bio:'Love coding, good food and travelling.',interests:['Tech','Travel','Music'],photos:[{src:'https://i.pravatar.cc/700?img=12',caption:'A little about me'}]};
let myProfile=loadMyProfile();
let previewMode='desktop';
function loadMyProfile(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY))||structuredClone(defaultMyProfile)}catch(e){return JSON.parse(JSON.stringify(defaultMyProfile))}}
function saveMyProfile(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(myProfile));return true}catch(e){toast('Storage is full. Try smaller photos.');return false}}
function tab(t){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='discover')renderDiscover();if(t==='matches')renderMatches();if(t==='home')renderHome();if(t==='profile')renderMyProfile()}
function renderHome(){
 document.getElementById('view').innerHTML=`<div class="home-launch">
 <section class="home-welcome"><div class="eyebrow">Welcome to coy.</div><h1>Discover. Connect. Your way.</h1><p>Your space to explore new connections while keeping your likes private. Start with the existing Coy experience or try the new Discover feature.</p><button class="primary" onclick="tab('discover')">Go to Discover →</button></section>
 <section class="home-launch-card"><div class="home-icon">💗</div><div class="eyebrow">Already on Coy?</div><h2 style="font-size:21px;margin:0">Open your Coy app</h2><p style="font-size:12px;color:var(--muted);line-height:1.5;margin:0">Continue to the existing Coy experience in a new tab. Your original Coy app remains separate from this Discover demo.</p><button class="primary" onclick="window.open('https://app.getcoy.com/login?next=/app','_blank','noopener')">Open existing Coy ↗</button></section>
 </div><div class="panel" style="max-width:820px;margin:0 auto"><h3>Make your profile yours</h3><p>Add photos, captions and interests, then preview how your profile appears on mobile and desktop.</p><button class="secondary" style="margin-top:12px" onclick="tab('profile')">Manage My Profile →</button></div>`;
}
function renderMyProfile(){
 const photos=myProfile.photos||[];
 document.getElementById('view').innerHTML=`<div class="section-head"><div><div class="eyebrow">Your space</div><h2>My Profile</h2><p>Make it yours, then preview how others see you.</p></div><span class="count-pill">PRIVATE SETTINGS</span></div>
 <div class="profile-layout"><section class="editor-panel"><div class="eyebrow">Profile editor</div><h2>Edit your profile</h2><p class="editor-sub">Your profile details are saved in this browser demo.</p>
 <div class="upload-zone" onclick="document.getElementById('photoInput').click()"><div style="font-size:24px">＋</div><strong>Upload photos</strong><small>Choose JPG, PNG or WEBP · Up to 6 photos</small></div><input id="photoInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
 <div class="photo-grid" id="myPhotoGrid">${photos.map((ph,i)=>`<div class="photo-tile"><img src="${ph.src}" alt="Your uploaded photo"><span class="primary-tag">${i===0?'PRIMARY':''}</span><div class="photo-tools"><button onclick="setPrimaryPhoto(${i})">Set first</button><button onclick="removeMyPhoto(${i})">Remove</button></div><input aria-label="Photo ${i+1} caption" placeholder="Photo caption" maxlength="90" value="${escapeHtml(ph.caption||'')}" oninput="updatePhotoCaption(${i},this.value)"></div>`).join('')}</div>
 <div class="editor-field"><label>Photo caption</label><input id="photoCaption" maxlength="90" value="${escapeHtml(photos[0]?.caption||'')}" placeholder="Add a caption for your first photo"></div>
 <div class="editor-field"><label>Your name</label><input id="myName" maxlength="35" value="${escapeHtml(myProfile.name)}"></div>
 <div class="editor-field"><label>Age</label><input id="myAge" type="number" min="18" max="99" value="${myProfile.age}"></div>
 <div class="editor-field"><label>City</label><input id="myCity" maxlength="45" value="${escapeHtml(myProfile.city)}"></div>
 <div class="editor-field"><label>Bio <span style="color:var(--muted);font-weight:500">(max 150 characters)</span></label><textarea id="myBio" maxlength="150">${escapeHtml(myProfile.bio)}</textarea><small id="bioCount" style="font-size:9px;color:var(--muted);text-align:right">${(myProfile.bio||'').length}/150</small></div>
 <div class="editor-field"><label>Interests</label><div class="interest-edit" id="interestChoices">${['Tech','Travel','Music','Fitness','Food','Photography','Books','Movies','Art','Sports','Cooking','Hiking'].map(x=>`<button type="button" class="interest-chip ${myProfile.interests.includes(x)?'selected':''}" data-interest="${x}">${x}</button>`).join('')}</div></div>
 <div class="modal-actions"><button class="primary" id="saveProfileBtn">Save changes</button><button class="secondary" id="resetProfileBtn">Reset</button></div><div class="saved-note" id="saveNote"></div>
 </section>
 <section class="preview-panel"><div class="preview-head"><div><div class="eyebrow">Live preview</div><h2>How others see you</h2></div><div class="preview-toggle"><button id="desktopPreview" class="${previewMode==='desktop'?'active':''}">▣ Desktop</button><button id="mobilePreview" class="${previewMode==='mobile'?'active':''}">▯ Mobile</button></div></div>
 <div class="preview-stage"><div class="preview-device ${previewMode}" id="profilePreview"></div></div><div class="preview-caption">Preview updates as you edit. Save to keep your changes in this demo.</div></section></div>`;
 document.getElementById('photoInput').onchange=handlePhotoUpload;
 document.getElementById('photoCaption').oninput=e=>{if(myProfile.photos[0])myProfile.photos[0].caption=e.target.value;updateLivePreview()};
 ['myName','myAge','myCity','myBio'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{collectProfileFields();updateLivePreview()}));
 document.getElementById('bioCount').textContent=(myProfile.bio||'').length+'/150';
 document.querySelectorAll('[data-interest]').forEach(b=>b.onclick=()=>{let v=b.dataset.interest;myProfile.interests.includes(v)?myProfile.interests=myProfile.interests.filter(x=>x!==v):myProfile.interests.push(v);b.classList.toggle('selected');updateLivePreview()});
 document.getElementById('saveProfileBtn').onclick=()=>{collectProfileFields();if(!myProfile.name.trim()||myProfile.age<18||myProfile.age>99){toast('Enter a name and a valid age (18+)');return}if(saveMyProfile()){document.getElementById('saveNote').textContent='✓ Profile saved on this device';toast('Profile saved')}};
 document.getElementById('resetProfileBtn').onclick=()=>{if(confirm('Reset your demo profile to its original details?')){myProfile=JSON.parse(JSON.stringify(defaultMyProfile));saveMyProfile();renderMyProfile()}};
 document.getElementById('desktopPreview').onclick=()=>{previewMode='desktop';renderMyProfile()};
 document.getElementById('mobilePreview').onclick=()=>{previewMode='mobile';renderMyProfile()};
 updateLivePreview();
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function collectProfileFields(){myProfile.name=document.getElementById('myName')?.value||myProfile.name;myProfile.age=+(document.getElementById('myAge')?.value||myProfile.age);myProfile.city=document.getElementById('myCity')?.value||'';myProfile.bio=document.getElementById('myBio')?.value||'';if(myProfile.photos[0])myProfile.photos[0].caption=document.getElementById('photoCaption')?.value||'';let count=document.getElementById('bioCount');if(count)count.textContent=myProfile.bio.length+'/150'}
function updateLivePreview(){let el=document.getElementById('profilePreview');if(!el)return;let p=myProfile,photo=p.photos?.[0]?.src||'https://i.pravatar.cc/700?img=12';el.className='preview-device '+previewMode;el.innerHTML=`<img class="preview-img" src="${photo}" alt="Profile preview"><div class="preview-copy"><span style="font-size:9px;color:#13815d;font-weight:900">● PROFILE PREVIEW</span><h3>${escapeHtml(p.name)}, ${p.age||'—'}</h3><div style="font-size:10px;color:var(--muted)">⌖ ${escapeHtml(p.city||'Add your city')}</div><p>${escapeHtml(p.bio||'Your bio will appear here.')}</p>${p.photos?.[0]?.caption?`<p style="font-style:italic">“${escapeHtml(p.photos[0].caption)}”</p>`:''}<div class="chips">${(p.interests||[]).slice(0,6).map(x=>`<span class="chip">${escapeHtml(x)}</span>`).join('')}</div></div>`}
function handlePhotoUpload(e){let files=Array.from(e.target.files||[]);let room=6-(myProfile.photos?.length||0);if(files.length>room){toast('You can add up to 6 photos');files=files.slice(0,room)}files.forEach(file=>{if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast('Use JPG, PNG or WEBP photos');return}let reader=new FileReader();reader.onload=ev=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.78);myProfile.photos.push({src:data,caption:''});renderMyProfile()};img.src=ev.target.result};reader.readAsDataURL(file)});e.target.value=''}
function updatePhotoCaption(i,value){if(myProfile.photos[i])myProfile.photos[i].caption=value;if(i===0){let f=document.getElementById('photoCaption');if(f)f.value=value}updateLivePreview()}
function removeMyPhoto(i){myProfile.photos.splice(i,1);renderMyProfile()}
function setPrimaryPhoto(i){let [p]=myProfile.photos.splice(i,1);myProfile.photos.unshift(p);renderMyProfile()}

</script>
</body></html>
